# Blueprint statique du dépôt. Le service officiel existant n'est PAS vérifié ici :
# sa branche, ses variables, son auto-déploiement et ses logs doivent être contrôlés
# séparément dans Render avant toute promotion.
services:
  - type: web
    name: jotcolis-preview
    runtime: static
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: ./dist
