name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - feature/fondations-jotcolis
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Build static preview
        run: npm run build
