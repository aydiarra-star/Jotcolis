name: CI
on:
  pull_request:
  push:
    branches:
      - "**"
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Tests SQL, frontend and build
        run: npm test
      - name: Build static preview
        run: npm run build
